[SNAPSHOT]
snapshot_interval_minutes = 1
compress_state = True

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 2048
extra_delimiters = ["_"]
parametrize_numeric_tokens = True

[MASKING]
masking = [
    {"regex_pattern": "blk_-?\\d+", "mask_with": "BlockId"},
    {"regex_pattern": "(\\d{1,3}\\.){3}\\d{1,3}:\\d{1,5}", "mask_with": "IP_PORT"},
    {"regex_pattern": "(\\d{1,3}\\.){3}\\d{1,3}", "mask_with": "IP"}
    ]
mask_prefix = <
mask_suffix = >
parameter_extraction_cache_capacity = 8192
